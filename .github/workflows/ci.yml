# Lint and test on every push and pull request.
# The tests are offline (fake embedder, reranker, and chat client), so no API key or
# model download is needed. The public manual PDF is downloaded (and cached) so the
# parser test runs too; if CMS is unreachable that test is skipped, not failed.
# The CMS edit tables are never downloaded here: they are AMA-licensed, and the edit
# tests use tiny synthetic files in the same format.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + dev extras; no PyTorch or Streamlit needed for tests)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src app eval tests

      - name: Cache the manual PDF
        uses: actions/cache@v4
        with:
          path: data/2026_ncci_medicare_policy_manual_all-chapters.pdf
          key: ncci-manual-2026

      - name: Download the manual PDF (public CMS document)
        continue-on-error: true
        run: |
          test -f data/2026_ncci_medicare_policy_manual_all-chapters.pdf || \
          curl -sSfL -o data/2026_ncci_medicare_policy_manual_all-chapters.pdf \
            https://www.cms.gov/files/document/2026-ncci-medicare-policy-manual-all-chapters.pdf

      - name: Test
        run: pytest -q -W error::ResourceWarning --cov --cov-report=term --cov-fail-under=85
