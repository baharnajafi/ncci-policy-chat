[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncci-rag"
version = "0.1.0"
description = "Chat with the CMS 2026 Medicare NCCI Policy Manual: hybrid retrieval with grounded, claim-level citations."
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "numpy>=1.26",
    "openai>=1.54",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0"]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
